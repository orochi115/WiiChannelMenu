; WiiChannelMenu 配置文件
; 放在 SD 卡: sd:/channelmenu/config.ini  (UTF-8 编码)
;
; 规则:
;  - 以 ; 或 # 开头的行是注释(只能整行注释, 不能写在值后面)
;  - 相对路径相对于 sd:/channelmenu/
;  - 文件不存在/格式错误/没有可用的 Channel 时, 直接返回系统菜单,
;    原因写在 sd:/channelmenu/log.txt
;  - 最多 12 个 [channel]

[menu]
; 可选. 用于显示中文名称的字体 (TTF/OTF/TTC, 不超过 24MB).
; font.otf 是思源黑体 (Noto Sans SC Bold) 的子集, 包含 GB2312 全部汉字和 ASCII,
; 许可证见 FONT-LICENSE.txt
font = font.otf

[channel]
; id: 4 字符 Title ID, 或 16 位十六进制完整 ID (如 0001000146314E4F)
id    = F1NO
name  = 炸弹人1
; 配图: PNG/JPG, 4:3 效果最好
image = bomberman.jpg

[channel]
id    = FGQC
name  = 炸弹人2
image = bomberman2.jpg

[channel]
id    = FFMZ
name  = 马力欧医生
image = drmario.jpg
